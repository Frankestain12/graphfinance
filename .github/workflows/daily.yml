name: GraphFinance daily

on:
  schedule:
    - cron: "23 3 * * *"  # 06:23 Türkiye — saat başından kaçır (GitHub tepe saatte cron atlayabiliyor)
    - cron: "23 5 * * *"  # 08:23 Türkiye — yedek tetik (mükerrer çalışma zararsız)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: Günlük çalıştırma
        run: |
          mkdir -p reports
          set -o pipefail
          python src/run_live.py 2>&1 | tee reports/last_run.log

      - name: Çıktıları commit'le
        if: always()
        run: |
          git config user.name "graphfinance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data_store docs reports models
          git commit -m "günlük çalıştırma $(date -u +%F)" || echo "değişiklik yok"
          git push
