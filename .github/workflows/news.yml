name: GraphFinance haber (saatlik)

on:
  schedule:
    - cron: "37 * * * *"   # her saat :37 — hafif haber koşusu
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: graphfinance-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: Haber koşusu
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          mkdir -p reports data_store
          set -o pipefail
          python src/run_news.py 2>&1 | tee reports/last_news_run.log

      - name: Çıktıları commit'le
        if: always()
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          git config user.name "graphfinance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git add -A data_store docs reports
            git commit -m "haber kosusu $(date -u +%FT%H:%M)" || echo "değişiklik yok"
            if git pull --rebase -X ours origin main && git push; then exit 0; fi
            echo "push catisti, gunluk kosunun ciktisi uzerine yeniden kuruluyor ($i)"
            git rebase --abort || true
            git fetch origin main && git reset --hard origin/main
            python src/run_news.py 2>&1 | tee reports/last_news_run.log || true
          done
          exit 1
